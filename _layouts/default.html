<!DOCTYPE html>
<html lang="{{ site.lang | default: 'tr' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    {% seo %}
    {% feed_meta %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#icerik">İçeriğe geç</a>
    <header class="site-header wrapper">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav aria-label="Ana menü">
        <a href="{{ '/' | relative_url }}">Yazılar</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
        <a href="https://github.com/mertokuyaz">GitHub ↗</a>
      </nav>
    </header>
    <main id="icerik" class="wrapper">{{ content }}</main>
    <footer class="site-footer wrapper">
      <span>© {{ 'now' | date: '%Y' }} {{ site.author }}</span>
      <span>Markdown ile yazıldı. GitHub Pages ile yayımlandı.</span>
    </footer>
  </body>
</html>
